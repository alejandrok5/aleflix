# Aleflix release revision, appended to Moonfin's version:
# Moonfin 3.0.0 + revision 1 = Aleflix 3.0.0.1.
#
# The upstream sync (.github/workflows/aleflix-sync.yml) sets this back to 1
# when it merges a new Moonfin release. Bump it by hand to publish an
# Aleflix-only release; pushing the bump to main publishes it.
revision=1
